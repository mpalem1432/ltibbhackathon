apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 1
  selector:
    matchLabels:
      app: dbapp
  template:
    metadata:
      labels:
        app: dbapp
    spec:
      imagePullSecrets:
        - name: mysecret
      # Added a security context block to give the MySQL user access to the storage volume
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql-db
          image: saikumar894/clientapp:dbimage
          ports:
            - containerPort: 3306
          env:                                # 👈 ADD THIS INITIALIZATION BLOCK
            - name: MYSQL_ROOT_PASSWORD
              value: "12345"
            - name: MYSQL_DATABASE
              value: "customers"              # Matches your repo script database name
          volumeMounts:
            - name: www
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "200m"
              memory: "100Mi"
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

