
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: sai
spec:
  serviceName: "mysql"
  replicas: 1
  selector:
    matchLabels:       
      app: dbapp
  template:            
    metadata:
      labels:
        app: dbapp
    spec:
      imagePullSecrets:
        - name: mysecret
      containers:
        - name: mycont                   
          image: saikumar894/clientapp:dbimage
          ports:                          
            - containerPort: 3306
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html/     # Fixed mountPath spelling (and updated target path logically for MySQL)
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "200m"
              memory: "100Mi"
  volumeClaimTemplates:                     
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]      # Fixed capitalization and indentation
        resources:
          requests:
            storage: 1Gi
